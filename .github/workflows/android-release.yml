# Android Release Build & Deploy
# Feature PR 머지 시 라벨에 따라 버전 bump 후 AAB 빌드
# 수동 실행도 가능

name: Android Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

  # 수동 실행 (긴급 재빌드 등)
  workflow_dispatch:
    inputs:
      bump_type:
        description: '버전 bump 타입'
        required: true
        default: 'build'
        type: choice
        options:
          - build    # 빌드 넘버만 (1.0.6+1 → 1.0.6+2)
          - patch    # 패치 (1.0.6 → 1.0.7)
          - minor    # 마이너 (1.0.6 → 1.1.0)
          - major    # 메이저 (1.0.6 → 2.0.0)
          - none     # 버전 변경 없이 현재 버전으로 빌드

permissions:
  contents: write
  pull-requests: read

env:
  FLUTTER_VERSION: '3.32.8'
  JAVA_VERSION: '17'

jobs:
  release:
    name: Version Bump & Build
    runs-on: ubuntu-latest
    # PR 머지 + release 라벨 있을 때, 또는 수동 실행 시
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:build')))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      # ============================================
      # Version Bump
      # ============================================
      - name: Determine bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.bump_type }}" >> $GITHUB_OUTPUT
            echo "Bump type (manual): ${{ github.event.inputs.bump_type }}"
          else
            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            echo "Labels: $LABELS"

            if echo "$LABELS" | grep -q "release:major"; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -q "release:minor"; then
              echo "type=minor" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -q "release:patch"; then
              echo "type=patch" >> $GITHUB_OUTPUT
            elif echo "$LABELS" | grep -q "release:build"; then
              echo "type=build" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Get current version
        id: current-version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Bump version
        id: new-version
        if: steps.bump-type.outputs.type != 'none'
        run: |
          BUMP_TYPE=${{ steps.bump-type.outputs.type }}
          CURRENT="${{ steps.current-version.outputs.version }}"

          # 버전 파싱 (예: 1.0.6+30)
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          # 빌드 번호는 항상 +1 (Android versionCode는 항상 증가해야 함)
          NEW_BUILD=$((BUILD_NUMBER + 1))

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            build)
              # 빌드 번호만 증가 (이미 위에서 처리됨)
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}+${NEW_BUILD}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

          # pubspec.yaml 업데이트
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Commit version bump
        if: steps.bump-type.outputs.type != 'none'
        run: |
          NEW_VERSION=${{ steps.new-version.outputs.version }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main

      # ============================================
      # Build AAB
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Gradle 캐싱 (빌드 속도 개선)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Setup SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops-v3.9.4.linux.amd64
          sudo mv sops-v3.9.4.linux.amd64 /usr/local/bin/sops
          echo "✅ SOPS 설치 완료"

      - name: Decrypt .env file
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d git.environment-variables/application.flutter/prod.sops.env > .env
          echo "✅ .env 파일 복호화 완료"

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Android signing
        run: |
          mkdir -p secrets

          # key.properties 생성
          cat > secrets/key.properties << EOF
          storePassword=$(sed -n 's/^KEYSTORE_PASSWORD=//p' .env)
          keyPassword=$(sed -n 's/^KEY_PASSWORD=//p' .env)
          keyAlias=$(sed -n 's/^KEY_ALIAS=//p' .env)
          storeFile=upload-keystore.jks
          EOF

          # keystore 파일 복원
          sed -n 's/^KEYSTORE_BASE64=//p' .env | base64 --decode > secrets/upload-keystore.jks
          echo "✅ Android signing setup complete"

      - name: Build AAB
        run: |
          flutter build appbundle --release --dart-define-from-file=config/flavors/prod.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 1

      - name: Upload mapping.txt (ProGuard)
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Summary
        run: |
          echo "## 🚀 Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | ${{ steps.current-version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | ${{ steps.new-version.outputs.version || steps.current-version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ steps.bump-type.outputs.type }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "AAB 파일이 Artifacts에 업로드되었습니다." >> $GITHUB_STEP_SUMMARY

  # Play Store 자동 배포
  deploy:
    name: Deploy to Play Store
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-release-aab
          path: ./release

      - name: Download mapping.txt
        uses: actions/download-artifact@v4
        with:
          name: android-mapping
          path: ./mapping
        continue-on-error: true

      - name: Check mapping file
        id: mapping
        run: |
          if [ -f ./mapping/mapping.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.bottlenote.official.app
          releaseFiles: ./release/*.aab
          track: internal
          status: draft
          mappingFile: ${{ steps.mapping.outputs.exists == 'true' && './mapping/mapping.txt' || '' }}

      - name: Deploy Summary
        run: |
          echo "## 🏪 Play Store 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Track | internal |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | draft |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Play Console에서 internal 트랙을 확인하세요." >> $GITHUB_STEP_SUMMARY
